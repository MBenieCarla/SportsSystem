{% extends 'base.html' %}

{% block title %}Create Team{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3><i class="fas fa-users"></i> Create Team</h3>
        </div>

        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Create Team
                </button>

                <a href="{% url 'trainer_dashboard' %}" class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
