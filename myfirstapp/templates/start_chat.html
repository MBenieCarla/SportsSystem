{% extends "base.html" %}

{% block title %}Start New Chat{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4><i class="fas fa-plus-circle"></i> Start New Chat</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{% if message.tags %}{{ message.tags }}{% else %}info{% endif %} alert-dismissible fade show">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chat Type</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="room_type" id="individual" value="individual" checked>
                                <label class="form-check-label" for="individual">
                                    <i class="fas fa-user"></i> Individual Chat
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="room_type" id="team" value="team">
                                <label class="form-check-label" for="team">
                                    <i class="fas fa-users"></i> Team Chat
                                </label>
                            </div>
                        </div>

                        <div id="individual-section">
                            <div class="mb-3">
                                <label for="user_id" class="form-label">Select User</label>
                                <select name="user_id" id="user_id" class="form-select">
                                    <option value="">Select a user...</option>
                                    {% for user in all_users %}
                                        <option value="{{ user.id }}">{{ user.username }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div id="team-section" style="display: none;">
                            <div class="mb-3">
                                <label for="team_id" class="form-label">Select Team</label>
                                <select name="team_id" id="team_id" class="form-select">
                                    <option value="">Select a team...</option>
                                    {% for team in my_teams %}
                                        <option value="{{ team.id }}">{{ team.team_name }}</option>
                                    {% endfor %}
                                </select>
                                {% if not my_teams %}
                                    <small class="text-muted">You don't have any teams yet.</small>
                                {% endif %}
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus"></i> Start Chat
                            </button>
                            <a href="{% url 'chat_list' %}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Toggle between individual and team chat sections
    document.querySelectorAll('input[name="room_type"]').forEach(function(radio) {
        radio.addEventListener('change', function() {
            if (this.value === 'individual') {
                document.getElementById('individual-section').style.display = 'block';
                document.getElementById('team-section').style.display = 'none';
            } else {
                document.getElementById('individual-section').style.display = 'none';
                document.getElementById('team-section').style.display = 'block';
            }
        });
    });
</script>
{% endblock %}
