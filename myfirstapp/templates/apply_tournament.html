{% extends "base.html" %}

{% block title %}Apply for Tournament{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Apply for Tournament Participation</h2>

    <form method="POST" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Submit Application
        </button>

        <a href="{% url 'tournament_applications' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
