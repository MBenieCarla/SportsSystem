{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="login-container">
    <h2>Login</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="login-btn">Login</button>
    </form>
    
    <div class="register-link">
        <p>Don't have an account?</p>
        <div class="register-buttons">
            <a href="{% url 'player_registration' %}" class="register-btn">Register as Player</a>
            <a href="{% url 'trainer_registration' %}" class="register-btn">Register as Trainer</a>
            <a href="{% url 'tournament_organiser_registration' %}" class="register-btn">Register as Organiser</a>
        </div>
    </div>
</div>
{% endblock %}
