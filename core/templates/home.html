{% extends 'base.html' %}
{% load static %}

{% block title %}Home - Community Sports{% endblock %}

{% block content %}
<div style="text-align: center; padding: 3rem; max-width: 800px; margin: 0 auto;">
    <div style="margin-bottom: 2rem;">
        <i class="fas fa-running" style="font-size: 4rem; color: var(--navy-blue);"></i>
    </div>
    <h1 style="color: var(--navy-blue); font-size: 2.5rem; margin-bottom: 1rem;">
        Community Sports Platform
    </h1>
    <p style="color: var(--gray-600); font-size: 1.2rem; margin-bottom: 2rem;">
        Connect, Play, and Grow Together!
    </p>
    
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="padding: 0.75rem 2rem;">
            <i class="fas fa-sign-in-alt"></i> Login
        </a>
        <a href="{% url 'accounts:register' %}" class="btn btn-secondary" style="padding: 0.75rem 2rem;">
            <i class="fas fa-user-plus"></i> Register
        </a>
    </div>
</div>
{% endblock %}
