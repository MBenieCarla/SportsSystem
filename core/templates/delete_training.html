{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Training{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; padding: 1rem; text-align: center;">
    <h1 style="color: #dc3545;">Delete Training</h1>
    <p>Are you sure you want to delete "{{ training.title }}"?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background: #dc3545; color: white; padding: 0.5rem 1.5rem; border: none; border-radius: 4px; cursor: pointer;">Yes, Delete</button>
        <a href="{% url 'core:trainer_trainings' %}" style="background: #6c757d; color: white; padding: 0.5rem 1.5rem; text-decoration: none; border-radius: 4px;">Cancel</a>
    </form>
</div>
{% endblock %}
